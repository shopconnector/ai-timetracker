# Build Windows Installer and Portable Package
# Triggers on tags (vX.Y.Z) or manual workflow_dispatch

name: Build Windows Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (e.g., 0.1.0)'
        required: false
        default: ''

env:
  NODE_VERSION: '20.18.1'
  PNPM_VERSION: '9.15.0'
  ACTIVITYWATCH_VERSION: '0.13.2'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Get version
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Install dependencies
        run: pnpm install

      - name: Create .env.production with OAuth secrets
        shell: pwsh
        run: |
          @"
          ATLASSIAN_OAUTH_CLIENT_SECRET=${{ secrets.ATLASSIAN_OAUTH_CLIENT_SECRET }}
          TEMPO_OAUTH_CLIENT_SECRET=${{ secrets.TEMPO_OAUTH_CLIENT_SECRET }}
          SLACK_OAUTH_CLIENT_SECRET=${{ secrets.SLACK_OAUTH_CLIENT_SECRET }}
          "@ | Out-File -FilePath apps/web/.env.production -Encoding utf8

      - name: Build application
        run: pnpm build
        env:
          ACTIVITYWATCH_URL: http://localhost:5600
          TEMPO_API_TOKEN: ""
          JIRA_BASE_URL: ""
          JIRA_SERVICE_EMAIL: ""
          JIRA_API_KEY: ""
          ATLASSIAN_OAUTH_CLIENT_SECRET: ${{ secrets.ATLASSIAN_OAUTH_CLIENT_SECRET }}
          TEMPO_OAUTH_CLIENT_SECRET: ${{ secrets.TEMPO_OAUTH_CLIENT_SECRET }}
          SLACK_OAUTH_CLIENT_SECRET: ${{ secrets.SLACK_OAUTH_CLIENT_SECRET }}

      - name: Ensure .env.production is in standalone bundle
        shell: pwsh
        run: |
          if (Test-Path apps/web/.env.production) {
            Copy-Item apps/web/.env.production -Destination apps/web/.next/standalone/apps/web/.env.production -Force
            Write-Host "Copied .env.production into standalone bundle"
            Get-Item apps/web/.next/standalone/apps/web/.env.production
          }

      - name: Verify standalone output
        shell: pwsh
        run: |
          if (-not (Test-Path "apps/web/.next/standalone")) {
            Write-Error "Standalone output not found!"
            exit 1
          }
          Write-Host "Standalone output verified"

      - name: Download Node.js runtime
        shell: pwsh
        run: |
          $NodeVersion = "${{ env.NODE_VERSION }}"
          $NodeUrl = "https://nodejs.org/dist/v$NodeVersion/node-v$NodeVersion-win-x64.zip"
          $NodeZip = "node-runtime.zip"
          
          Write-Host "Downloading Node.js v$NodeVersion..."
          Invoke-WebRequest -Uri $NodeUrl -OutFile $NodeZip
          
          Write-Host "Extracting..."
          Expand-Archive -Path $NodeZip -DestinationPath "node-extract"
          
          New-Item -ItemType Directory -Path "dist/windows/node" -Force | Out-Null
          $NodeDir = Get-ChildItem "node-extract" | Select-Object -First 1
          Copy-Item "$($NodeDir.FullName)/node.exe" "dist/windows/node/"
          
          Remove-Item -Recurse -Force "node-extract", $NodeZip
          Write-Host "Node.js runtime ready"

      - name: Download ActivityWatch
        shell: pwsh
        run: |
          $AwVersion = "${{ env.ACTIVITYWATCH_VERSION }}"
          $AwUrl = "https://github.com/ActivityWatch/activitywatch/releases/download/v$AwVersion/activitywatch-v$AwVersion-windows-x86_64.zip"
          $AwZip = "activitywatch.zip"

          Write-Host "Downloading ActivityWatch v$AwVersion..."
          Invoke-WebRequest -Uri $AwUrl -OutFile $AwZip

          Write-Host "Extracting..."
          Expand-Archive -Path $AwZip -DestinationPath "aw-extract"

          # AW zip contains activitywatch/ directory with aw-qt.exe, aw-server, watchers etc.
          New-Item -ItemType Directory -Path "dist/windows/activitywatch" -Force | Out-Null
          Copy-Item -Recurse "aw-extract/activitywatch/*" "dist/windows/activitywatch/"

          Remove-Item -Recurse -Force "aw-extract", $AwZip
          Write-Host "ActivityWatch v$AwVersion ready"

          # Verify aw-qt.exe exists
          if (Test-Path "dist/windows/activitywatch/aw-qt.exe") {
            Write-Host "✓ aw-qt.exe found"
          } else {
            Write-Error "aw-qt.exe not found in extracted archive!"
            Get-ChildItem "dist/windows/activitywatch" -Recurse | Select-Object -First 20
            exit 1
          }

      - name: Prepare bundle
        shell: pwsh
        run: |
          # Create directories
          New-Item -ItemType Directory -Path "dist/windows/app" -Force | Out-Null
          New-Item -ItemType Directory -Path "dist/windows/data" -Force | Out-Null
          
          # Copy standalone
          Copy-Item -Recurse "apps/web/.next/standalone/*" "dist/windows/app/"
          
          # Copy static files
          if (Test-Path "apps/web/.next/static") {
            New-Item -ItemType Directory -Path "dist/windows/app/apps/web/.next/static" -Force | Out-Null
            Copy-Item -Recurse "apps/web/.next/static/*" "dist/windows/app/apps/web/.next/static/"
          }
          
          # Copy public
          if (Test-Path "apps/web/public") {
            New-Item -ItemType Directory -Path "dist/windows/app/apps/web/public" -Force | Out-Null
            Copy-Item -Recurse "apps/web/public/*" "dist/windows/app/apps/web/public/"
          }
          
          # Copy config example
          Copy-Item ".env.example" "dist/windows/data/.env.example"
          
          Write-Host "Bundle structure:"
          Get-ChildItem -Recurse "dist/windows" -Directory | ForEach-Object { Write-Host "  $($_.FullName)" }

      - name: Flatten pnpm paths (MAX_PATH fix)
        shell: pwsh
        run: |
          $AppDir = "dist/windows/app"

          # Dynamically find the node_modules with .pnpm (works with/without workspace wrapper)
          $nodeModulesPath = $null
          Get-ChildItem -Path $AppDir -Directory -Recurse -Filter "node_modules" | ForEach-Object {
            if ((Test-Path (Join-Path $_.FullName ".pnpm")) -and -not $nodeModulesPath) {
              $nodeModulesPath = $_.FullName
            }
          }
          if (-not $nodeModulesPath) {
            Write-Host "No .pnpm directory found anywhere in $AppDir - skipping flatten"
            exit 0
          }
          $pnpmDir = Join-Path $nodeModulesPath ".pnpm"
          Write-Host "Found pnpm node_modules at: $nodeModulesPath"

          Write-Host "Flattening pnpm node_modules for Windows MAX_PATH compatibility..."

          # Copy all packages from .pnpm/*/node_modules/ to flat node_modules/
          $packagesCopied = 0
          Get-ChildItem $pnpmDir -Directory | Where-Object { $_.Name -ne "node_modules" } | ForEach-Object {
            $innerNm = Join-Path $_.FullName "node_modules"
            if (Test-Path $innerNm) {
              # Non-scoped packages
              Get-ChildItem $innerNm -Directory | Where-Object { $_.Name -notlike "@*" } | ForEach-Object {
                $target = Join-Path $nodeModulesPath $_.Name
                $isReal = (Test-Path $target) -and -not ((Get-Item $target -Force).Attributes -band [System.IO.FileAttributes]::ReparsePoint)
                if (-not $isReal) {
                  if (Test-Path $target) { Remove-Item $target -Force }
                  Copy-Item -Recurse -Force $_.FullName $target
                  $packagesCopied++
                }
              }
              # Scoped packages (@scope/pkg)
              Get-ChildItem $innerNm -Directory | Where-Object { $_.Name -like "@*" } | ForEach-Object {
                $scopeTarget = Join-Path $nodeModulesPath $_.Name
                if (-not (Test-Path $scopeTarget)) { New-Item -ItemType Directory -Path $scopeTarget -Force | Out-Null }
                Get-ChildItem $_.FullName -Directory | ForEach-Object {
                  $pkgTarget = Join-Path $scopeTarget $_.Name
                  $isReal = (Test-Path $pkgTarget) -and -not ((Get-Item $pkgTarget -Force).Attributes -band [System.IO.FileAttributes]::ReparsePoint)
                  if (-not $isReal) {
                    if (Test-Path $pkgTarget) { Remove-Item $pkgTarget -Force }
                    Copy-Item -Recurse -Force $_.FullName $pkgTarget
                    $packagesCopied++
                  }
                }
              }
            }
          }
          Write-Host "Copied $packagesCopied packages to flat layout"

          # Remove symlinks/junctions in node_modules
          Get-ChildItem $nodeModulesPath -Force | Where-Object {
            ($_.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -and ($_.Name -ne ".pnpm")
          } | Remove-Item -Force

          # Remove .pnpm directory
          Remove-Item -Recurse -Force $pnpmDir
          Write-Host "Removed .pnpm directory"

          # Remove ALL nested node_modules (except root we just flattened)
          # On Windows, Copy-Item resolves junctions to real copies, leaving orphan
          # packages that break Node.js resolution (e.g. next can't find styled-jsx)
          $rootNm = (Resolve-Path $nodeModulesPath).Path
          Write-Host "Root node_modules (keeping): $rootNm"
          Get-ChildItem -Path $AppDir -Directory -Recurse -Filter "node_modules" | Where-Object {
            (Resolve-Path $_.FullName).Path -ne $rootNm
          } | ForEach-Object {
            Remove-Item $_.FullName -Recurse -Force
            Write-Host "Removed nested: $($_.FullName)"
          }

          # Verify max path length
          $maxLen = 0
          $base = "C:\Users\LongUsername\AppData\Local\TimeTracker\app\"
          Get-ChildItem -Path $AppDir -Recurse -File | ForEach-Object {
            $rel = $_.FullName.Replace("$((Resolve-Path $AppDir).Path)\", "")
            $winPath = $base + $rel
            if ($winPath.Length -gt $maxLen) { $maxLen = $winPath.Length; $maxFile = $winPath }
          }
          Write-Host "Max simulated Windows path: $maxLen chars"
          if ($maxLen -ge 260) {
            Write-Error "Paths still exceed MAX_PATH after flatten! Longest: $maxFile"
            exit 1
          }
          Write-Host "All paths within MAX_PATH limit"

      - name: Create start-server.js
        shell: pwsh
        run: |
          $StartServerContent = @'
          // TimeTracker start-server.js
          // Loads env vars from data\.env.local before starting the Next.js server.
          // This replaces the fragile batch-file env parser that broke on Windows
          // with values containing special characters or empty values.
          const fs = require('fs');
          const path = require('path');

          const envFile = path.join(__dirname, 'data', '.env.local');
          if (fs.existsSync(envFile)) {
            const lines = fs.readFileSync(envFile, 'utf-8').split(/\r?\n/);
            let loaded = 0;
            for (const line of lines) {
              const trimmed = line.trim();
              if (!trimmed || trimmed.startsWith('#')) continue;
              const eqIdx = trimmed.indexOf('=');
              if (eqIdx > 0) {
                const key = trimmed.substring(0, eqIdx).trim();
                let val = trimmed.substring(eqIdx + 1).trim();
                // Strip surrounding quotes if present
                if ((val.startsWith('"') && val.endsWith('"')) || (val.startsWith("'") && val.endsWith("'"))) {
                  val = val.slice(1, -1);
                }
                if (val) {
                  process.env[key] = val;
                  loaded++;
                }
              }
            }
            console.log(`[start-server] Loaded ${loaded} env vars from data/.env.local`);
          } else {
            console.log('[start-server] No data/.env.local found — using system env vars only');
          }

          // Log Jira config status (helps diagnose "tasks not loading" issues)
          const jiraUrl = process.env.JIRA_BASE_URL;
          const jiraEmail = process.env.JIRA_SERVICE_EMAIL;
          const jiraKey = process.env.JIRA_API_KEY;
          if (jiraUrl && jiraEmail && jiraKey) {
            console.log(`[start-server] Jira: configured (${jiraUrl})`);
          } else {
            const missing = [];
            if (!jiraUrl) missing.push('JIRA_BASE_URL');
            if (!jiraEmail) missing.push('JIRA_SERVICE_EMAIL');
            if (!jiraKey) missing.push('JIRA_API_KEY');
            console.log(`[start-server] WARNING: Jira not fully configured — missing: ${missing.join(', ')}`);
          }

          // Start the Next.js server
          require('./app/apps/web/server.js');
          '@

          Set-Content -Path "dist/windows/start-server.js" -Value $StartServerContent -Encoding UTF8
          Write-Host "start-server.js created"

      - name: Create launcher
        shell: pwsh
        run: |
          $LauncherContent = @'
          @echo off
          chcp 65001 >nul 2>&1
          title AI TimeTracker
          cd /d "%~dp0"

          set PORT=5666
          set APP_URL=http://localhost:%PORT%/timetracker
          set AW_URL=http://localhost:5600

          :: Kill any previous TimeTracker node processes
          tasklist /FI "IMAGENAME eq node.exe" 2>nul | findstr /I "node.exe" >nul 2>&1
          if %errorlevel% equ 0 (
              echo   Stopping previous TimeTracker instance...
              taskkill /F /IM node.exe >nul 2>&1
              timeout /t 2 /nobreak >nul
          )

          echo.
          echo ═══════════════════════════════════════════════════════════════════
          echo              AI TimeTracker v${{ steps.version.outputs.version }}
          echo ═══════════════════════════════════════════════════════════════════
          echo.

          :: Check and start ActivityWatch
          echo Checking ActivityWatch...
          curl -s -o nul -w "" %AW_URL%/api/0/info >nul 2>&1
          if %errorlevel% neq 0 (
              echo   ActivityWatch not running, starting...
              if exist "%~dp0activitywatch\aw-qt.exe" (
                  echo   Starting bundled ActivityWatch...
                  start "" "%~dp0activitywatch\aw-qt.exe"
                  timeout /t 5 /nobreak >nul
              ) else if exist "%LOCALAPPDATA%\activitywatch\aw-qt.exe" (
                  echo   Starting system ActivityWatch...
                  start "" "%LOCALAPPDATA%\activitywatch\aw-qt.exe"
                  timeout /t 5 /nobreak >nul
              ) else (
                  echo.
                  echo   WARNING: ActivityWatch not found!
                  echo   Download from: https://activitywatch.net/downloads/
                  echo.
              )
          ) else (
              echo   OK - ActivityWatch running
          )

          :: Check configuration
          echo Checking configuration...
          if not exist "data\.env.local" (
              if exist "data\.env.example" (
                  copy "data\.env.example" "data\.env.local" >nul
                  echo.
                  echo   FIRST RUN: Please configure API tokens in data\.env.local
                  echo.
                  notepad "data\.env.local"
                  echo   Press any key after saving...
                  pause >nul
              )
          )

          :: Env vars from data\.env.local are loaded by start-server.js (Node.js side)
          set NODE_ENV=production
          set HOSTNAME=localhost
          if not defined ACTIVITYWATCH_URL set "ACTIVITYWATCH_URL=http://localhost:5600"

          echo.
          echo ═══════════════════════════════════════════════════════════════════
          echo   Starting: %APP_URL%
          echo   Press Ctrl+C to stop
          echo ═══════════════════════════════════════════════════════════════════
          echo.

          start "" /min cmd /c "timeout /t 3 /nobreak >nul && start %APP_URL%"

          :start_server
          echo [%date% %time%] Starting server...
          "node\node.exe" "start-server.js"
          set EXIT_CODE=%errorlevel%
          echo [%date% %time%] Server exited (code: %EXIT_CODE%)
          echo.
          if exist "%~dp0update.flag" (
              del "%~dp0update.flag"
              echo   Update in progress, waiting for installer to finish...
              timeout /t 15 /nobreak >nul
          ) else (
              echo   Server stopped. Restarting in 5 seconds... (close window to stop)
              timeout /t 5 /nobreak >nul
          )
          goto start_server
          '@

          Set-Content -Path "dist/windows/TimeTracker.bat" -Value $LauncherContent -Encoding UTF8

      - name: Create PowerShell launcher
        shell: pwsh
        run: |
          $PsLauncherContent = @'
          # AI TimeTracker Launcher (PowerShell)
          $ErrorActionPreference = "SilentlyContinue"
          $ScriptDir = Split-Path -Parent $MyInvocation.MyCommand.Path
          Set-Location $ScriptDir

          $Port = 5666
          $AppUrl = "http://localhost:$Port/timetracker"
          $AwUrl = "http://localhost:5600"

          Write-Host ""
          Write-Host "AI TimeTracker - Starting..." -ForegroundColor Cyan
          Write-Host ""

          # Check and start ActivityWatch
          try {
              $null = Invoke-RestMethod -Uri "$AwUrl/api/0/info" -TimeoutSec 2
              Write-Host "[OK] ActivityWatch running" -ForegroundColor Green
          } catch {
              Write-Host "[!] ActivityWatch not running, starting..." -ForegroundColor Yellow

              # Try bundled first, then system install
              $awPaths = @(
                  "$ScriptDir\activitywatch\aw-qt.exe",
                  "$env:LOCALAPPDATA\activitywatch\aw-qt.exe",
                  "$env:LOCALAPPDATA\Programs\activitywatch\aw-qt.exe"
              )
              $started = $false
              foreach ($path in $awPaths) {
                  if (Test-Path $path) {
                      Write-Host "    Starting: $path" -ForegroundColor Gray
                      Start-Process $path
                      Start-Sleep -Seconds 5
                      $started = $true
                      break
                  }
              }
              if (-not $started) {
                  Write-Host "    ActivityWatch not found!" -ForegroundColor Red
                  Write-Host "    Download: https://activitywatch.net/downloads/" -ForegroundColor Gray
              }
          }

          # Check config
          if (-not (Test-Path "data\.env.local")) {
              if (Test-Path "data\.env.example") {
                  Copy-Item "data\.env.example" "data\.env.local"
                  Write-Host "[!] First run - please configure data\.env.local" -ForegroundColor Yellow
                  Start-Process notepad "data\.env.local" -Wait
              }
          }

          # Env vars from data\.env.local are loaded by start-server.js (Node.js side)

          # Set server env
          $env:NODE_ENV = "production"
          $env:HOSTNAME = "localhost"
          $env:PORT = $Port

          Write-Host ""
          Write-Host "Starting server on $AppUrl" -ForegroundColor Cyan
          Write-Host "Press Ctrl+C to stop" -ForegroundColor Gray
          Write-Host ""

          # Open browser
          Start-Job { Start-Sleep -Seconds 3; Start-Process $using:AppUrl } | Out-Null

          # Start server (start-server.js loads .env.local before launching Next.js)
          & "node\node.exe" "start-server.js"
          '@

          Set-Content -Path "dist/windows/TimeTracker.ps1" -Value $PsLauncherContent -Encoding UTF8
          Write-Host "PowerShell launcher created"

      - name: Create silent launcher (VBS)
        shell: pwsh
        run: |
          Copy-Item "scripts/windows/TimeTrackerSilent.vbs" "dist/windows/TimeTrackerSilent.vbs"
          Write-Host "Silent VBS launcher created"

      - name: Create portable zip
        shell: pwsh
        run: |
          $Version = "${{ steps.version.outputs.version }}"
          $ZipName = "TimeTracker-$Version-portable-x64.zip"
          
          Compress-Archive -Path "dist/windows/*" -DestinationPath "dist/$ZipName" -CompressionLevel Optimal
          Write-Host "Created: $ZipName"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          Write-Host "Inno Setup installed"

      - name: Update installer version
        shell: pwsh
        run: |
          $Version = "${{ steps.version.outputs.version }}"
          $IssFile = "installer/timetracker.iss"
          
          $Content = Get-Content $IssFile -Raw
          $Content = $Content -replace '#define MyAppVersion ".*"', "#define MyAppVersion `"$Version`""
          Set-Content -Path $IssFile -Value $Content
          
          Write-Host "Updated installer version to: $Version"

      - name: Enable long paths
        shell: pwsh
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
          git config --system core.longpaths true
          Write-Host "Long paths enabled"

      - name: Build installer
        shell: pwsh
        run: |
          $InnoPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"

          # Map repo to short drive letter to avoid MAX_PATH issues with pnpm paths
          subst B: $PWD
          Push-Location B:\

          & $InnoPath "installer\timetracker.iss"

          if ($LASTEXITCODE -ne 0) {
            Pop-Location
            subst B: /d
            Write-Error "Inno Setup failed"
            exit 1
          }

          Pop-Location
          subst B: /d

          # Move output to dist
          Move-Item "installer\output\*.exe" "dist\"
          Write-Host "Installer created"

      - name: Verify installer metadata
        shell: pwsh
        run: |
          $Version = "${{ steps.version.outputs.version }}"
          $Exe = Get-ChildItem "dist" -Filter "TimeTracker-Setup-*.exe" | Select-Object -First 1

          if (-not $Exe) {
            Write-Error "No installer EXE found in dist/"
            exit 1
          }

          Write-Host "Checking PE metadata for: $($Exe.Name)"
          $Info = (Get-Item $Exe.FullName).VersionInfo

          $Errors = @()

          # Note: Inno Setup PE fields may have trailing whitespace, so use .Trim()
          # Check version
          $FileVersion = if ($Info.FileVersion) { $Info.FileVersion.Trim() } else { "" }
          if (-not $FileVersion) {
            $Errors += "FileVersion is empty"
          } elseif (-not $FileVersion.StartsWith($Version)) {
            $Errors += "FileVersion '$FileVersion' does not match expected '$Version'"
          } else {
            Write-Host "  Version: $FileVersion" -ForegroundColor Green
          }

          # Check company
          $Company = if ($Info.CompanyName) { $Info.CompanyName.Trim() } else { "" }
          if ($Company -ne "ShopConnector") {
            $Errors += "CompanyName is '$Company', expected 'ShopConnector'"
          } else {
            Write-Host "  Company: $Company" -ForegroundColor Green
          }

          # Check product name
          $Product = if ($Info.ProductName) { $Info.ProductName.Trim() } else { "" }
          if ($Product -ne "AI TimeTracker") {
            $Errors += "ProductName is '$Product', expected 'AI TimeTracker'"
          } else {
            Write-Host "  Product: $Product" -ForegroundColor Green
          }

          # Check description
          $Desc = if ($Info.FileDescription) { $Info.FileDescription.Trim() } else { "" }
          if (-not $Desc) {
            $Errors += "FileDescription is empty"
          } else {
            Write-Host "  Description: $Desc" -ForegroundColor Green
          }

          if ($Errors.Count -gt 0) {
            Write-Host ""
            foreach ($e in $Errors) {
              Write-Host "  ERROR: $e" -ForegroundColor Red
            }
            Write-Error "Installer PE metadata verification failed!"
            exit 1
          }

          Write-Host "Installer metadata verified successfully" -ForegroundColor Green

      # ──────────────────────────────────────────────────────────────
      # Code Signing with Azure Trusted Signing
      # Based on: hanselman.com/blog/automatically-signing-a-windows-exe
      #
      # Signs the .exe installer to eliminate Windows SmartScreen warnings.
      # Uses short-lived (3-day) certs with RFC 3161 timestamping so
      # signatures remain valid after cert expiry.
      # Skipped when secrets are not configured — build still works unsigned.
      #
      # Required GitHub Secrets (4 — created via az ad sp create-for-rbac):
      #   AZURE_TENANT_ID          - Directory (tenant) ID
      #   AZURE_CLIENT_ID          - Service Principal client ID
      #   AZURE_CLIENT_SECRET      - Service Principal client secret
      #   AZURE_SUBSCRIPTION_ID    - Azure subscription ID
      #
      # Non-secret config (hardcoded below, change if your account differs):
      #   Endpoint:    https://plc.codesigning.azure.net/  (Poland Central)
      #   Account:     app-signing
      #   Cert Profile: AppProfile
      # ──────────────────────────────────────────────────────────────
      - name: Azure Login for code signing
        if: ${{ env.AZURE_TENANT_ID != '' }}
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - name: Sign installer with Azure Trusted Signing
        if: ${{ env.AZURE_TENANT_ID != '' }}
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://plc.codesigning.azure.net/
          trusted-signing-account-name: app-signing
          certificate-profile-name: AppProfile
          files-folder: ${{ github.workspace }}/dist
          files-folder-filter: exe
          files-folder-recurse: false
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify code signature
        if: ${{ env.AZURE_TENANT_ID != '' }}
        shell: pwsh
        run: |
          Write-Host "Verifying code signatures..."
          $AllSigned = $true
          Get-ChildItem "dist" -Filter "*.exe" | ForEach-Object {
            $Sig = Get-AuthenticodeSignature $_.FullName
            if ($Sig.Status -eq "Valid") {
              Write-Host "  OK $($_.Name): Signed by $($Sig.SignerCertificate.Subject)" -ForegroundColor Green
              # Show certificate details
              $Cert = $Sig.SignerCertificate
              Write-Host "     Issuer: $($Cert.Issuer)" -ForegroundColor Gray
              Write-Host "     Valid: $($Cert.NotBefore) - $($Cert.NotAfter)" -ForegroundColor Gray
            } else {
              Write-Host "  FAIL $($_.Name): $($Sig.Status)" -ForegroundColor Red
              $AllSigned = $false
            }
          }
          if (-not $AllSigned) {
            Write-Error "Some files are not properly signed!"
            exit 1
          }
          Write-Host "All executables signed successfully" -ForegroundColor Green

      - name: Signing status
        if: ${{ env.AZURE_TENANT_ID == '' }}
        shell: pwsh
        run: |
          Write-Host "Code signing SKIPPED — Azure Trusted Signing secrets not configured" -ForegroundColor Yellow
          Write-Host "  See: hanselman.com/blog/automatically-signing-a-windows-exe" -ForegroundColor Yellow

      - name: List artifacts
        shell: pwsh
        run: |
          Write-Host "Build artifacts:"
          Get-ChildItem "dist" -File | ForEach-Object {
            $SizeMB = [math]::Round($_.Length / 1MB, 2)
            Write-Host "  $($_.Name) - $SizeMB MB"
          }

      - name: Test server startup
        shell: pwsh
        run: |
          Write-Host "Testing server startup..."

          # Set env vars
          $env:NODE_ENV = "production"
          $env:HOSTNAME = "localhost"
          $env:PORT = "5666"
          $env:ACTIVITYWATCH_URL = "http://localhost:5600"

          # Start server in background (use start-server.js relative, working dir = dist/windows)
          Push-Location "dist/windows"
          $ServerProcess = Start-Process -FilePath "node/node.exe" `
            -ArgumentList "start-server.js" `
            -PassThru -NoNewWindow -RedirectStandardError "server-stderr.log"
          Pop-Location

          Start-Sleep -Seconds 10

          # Show any server errors
          $StderrLog = "dist/windows/server-stderr.log"
          if (Test-Path $StderrLog) {
            $Errors = Get-Content $StderrLog -ErrorAction SilentlyContinue
            if ($Errors) {
              Write-Host "Server stderr:" -ForegroundColor Yellow
              $Errors | ForEach-Object { Write-Host "  $_" }
            }
          }

          # Test endpoints
          $TestUrls = @(
            @{ Name = "API Status"; Url = "http://localhost:5666/timetracker/api/status" },
            @{ Name = "Home Page"; Url = "http://localhost:5666/timetracker/" },
            @{ Name = "Settings Page"; Url = "http://localhost:5666/timetracker/settings" },
            @{ Name = "My Issues Page"; Url = "http://localhost:5666/timetracker/my-issues" }
          )

          $AllPassed = $true
          foreach ($Test in $TestUrls) {
            try {
              $Response = Invoke-WebRequest -Uri $Test.Url -TimeoutSec 5 -UseBasicParsing
              if ($Response.StatusCode -eq 200) {
                Write-Host "✓ $($Test.Name): $($Response.StatusCode)" -ForegroundColor Green
              } else {
                Write-Host "✗ $($Test.Name): $($Response.StatusCode)" -ForegroundColor Red
                $AllPassed = $false
              }
            } catch {
              Write-Host "✗ $($Test.Name): FAILED - $($_.Exception.Message)" -ForegroundColor Red
              $AllPassed = $false
            }
          }

          # Stop server
          Stop-Process -Id $ServerProcess.Id -Force -ErrorAction SilentlyContinue

          if (-not $AllPassed) {
            Write-Error "Some endpoint tests failed!"
            exit 1
          }
          Write-Host "All endpoint tests PASSED" -ForegroundColor Green

      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        with:
          name: TimeTracker-portable
          path: dist/TimeTracker-*-portable-*.zip
          retention-days: 30

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: TimeTracker-installer
          path: dist/TimeTracker-Setup-*.exe
          retention-days: 30

      - name: Create stable-named copies
        shell: pwsh
        run: |
          $Version = "${{ steps.version.outputs.version }}"
          # Create stable-named copy of installer (for permanent download link)
          Copy-Item "dist/TimeTracker-Setup-$Version-x64.exe" "dist/TimeTracker-Setup-x64.exe"
          Write-Host "Created stable-named copy: TimeTracker-Setup-x64.exe"

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"

          # Detect if installer was signed
          SIGNED=""
          if [ -n "${{ env.AZURE_TENANT_ID }}" ]; then
            SIGNED="✅ **Digitally signed** — verified publisher: ShopConnector"
          else
            SIGNED="⚠️ This build is not code-signed. Windows SmartScreen may show a warning — click \"More info\" → \"Run anyway\"."
          fi

          # If release already exists (created by macOS or prior run), upload Windows assets to it.
          # Otherwise create a new release. Never delete — that would race-clobber assets from the parallel macOS job.
          if gh release view "$TAG" &>/dev/null; then
            echo "Release $TAG exists, uploading Windows artifacts..."
            gh release upload "$TAG" \
              "dist/TimeTracker-Setup-${VERSION}-x64.exe" \
              "dist/TimeTracker-Setup-x64.exe" \
              "dist/TimeTracker-${VERSION}-portable-x64.zip" \
              --clobber
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" \
              "dist/TimeTracker-Setup-${VERSION}-x64.exe" \
              "dist/TimeTracker-Setup-x64.exe" \
              "dist/TimeTracker-${VERSION}-portable-x64.zip" \
              --title "AI TimeTracker $TAG" \
              --notes "$(cat <<EOF
          ## Download

          **[TimeTracker-Setup-x64.exe](https://github.com/shopconnector/ai-timetracker/releases/latest/download/TimeTracker-Setup-x64.exe)** — always the latest version

          ${SIGNED}

          ## Installation
          1. Download \`TimeTracker-Setup-x64.exe\`
          2. Run installer
          3. Launch "AI TimeTracker" from Start Menu

          ## Included
          - **ActivityWatch** v${{ env.ACTIVITYWATCH_VERSION }} (starts automatically with TimeTracker)

          ## Requirements
          - Jira/Tempo API tokens (configure in Settings after first launch)
          EOF
          )"
          fi
